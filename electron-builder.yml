# electron-builder configuration. `pnpm dist` builds installers for the current platform;
# pass --mac/--win/--linux (and --dir for an unpacked app) to choose targets.
appId: io.boostnote.app
productName: Boostnote
copyright: Copyright © 2016-2026 BoostIO, Inc. and contributors

directories:
  output: dist
  buildResources: resources

# The app runs from source: the main process loads TS/JSX through remix/node-tsx and the Remix
# asset server compiles browser modules on demand, so the sources and tsconfig ship with the app.
files:
  - package.json
  - tsconfig.json
  - remix.json
  - src/**/*
  - resources/app.png
  - "!**/*.test.*"
# No asar. Tried with `asar: true` + `asarUnpack: ["**/*.node"]` (phase 6): node-tsx then loads the
# main process from the archive fine (Node's fs is asar-aware), but the asset server resolves and
# reads browser modules with native code (oxc-resolver, oxc, lightningcss) that sees only the real
# filesystem, so nothing inside app.asar exists for it: resolution escapes the archive (or fails),
# the top-level `getScriptEntry` in src/app/assets.ts never succeeds and the app never opens a
# window. Unpacking everything the asset server reads (src/ and the browser packages) is no asar.
asar: false

# Opening a .md file (Finder "Open With", double-click, Explorer) opens its folder as a vault and the
# note in a tab (`open-file` on macOS, argv on Windows/Linux; see src/main/main.ts).
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown note
    mimeType: text/markdown
    role: Editor
    rank: Alternate

mac:
  category: public.app-category.productivity
  icon: resources/app.icns
  target:
    - dmg
    - zip
dmg:
  icon: resources/dmg.icns
win:
  icon: resources/app.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/app.png
  category: Office
  synopsis: Note-taking app for programmers
  target:
    - AppImage
    - deb

publish: null
